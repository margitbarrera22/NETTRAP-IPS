---
# NetTrap-IPS · Reglas de Correlación SIEM/IPS (YAML)
# Formato: id, nombre, fuente, umbral, ventana_seg, severidad, accion, cve_mitigated
# Normas: OWASP ASVS V5.1.1 / NIST SP 800-218 PW.9.1 / ISO 27033-1 Cl. 10.3

sources:
  - id: "windows_event_log"
    name: "Windows Event Log"
    channels: ["Security", "System"]
    event_ids: [4625, 4624, 4672, 7045]
    description: "Eventos nativos del sistema operativo (fallos de autenticación, escalada de privilegios)"
  
  - id: "windows_firewall"
    name: "Windows Defender Firewall"
    log_path: "C:\\Windows\\System32\\LogFiles\\Firewall\\pfirewall.log"
    description: "Logs de tráfico bloqueado (DROP) y paquetes rechazados por directivas de firewall"
  
  - id: "network_traffic"
    name: "Tráfico de Red y Conexiones Activas"
    description: "Telemetría de sockets TCP/UDP entrantes, ráfagas SYN y sondeos de red"

rules:
  - id: RULE-001
    name: "Fuerza Bruta de Autenticación Windows (EventID 4625)"
    source: "windows_event_log"
    description: "≥5 intentos fallidos de inicio de sesión desde la misma IP en 60 s"
    threshold: 5
    window_seconds: 60
    severity: "CRITICAL"
    action: "block_and_capture"
    cve_mitigated:
      - "CVE-2019-0708"    # BlueKeep / Fuerza bruta de acceso RDP
      - "CVE-2023-38408"   # Intento de autenticación hostil en servicios remotos

  - id: RULE-002
    name: "Escaneo Rápido de Reconocimiento de Red (Nmap SYN Scan)"
    source: "network_traffic"
    description: "≥8 conexiones entrantes rápidas desde la misma IP en 30 s hacia puertos del sistema"
    threshold: 8
    window_seconds: 30
    severity: "CRITICAL"
    action: "block_and_capture"
    cve_mitigated:
      - "CVE-2024-37032"   # Reconocimiento previo y enumeración de APIs locales

  - id: RULE-003
    name: "Violación Reiterada de Políticas en Windows Firewall"
    source: "windows_firewall"
    description: "≥4 paquetes bloqueados (DROP) por el firewall desde la misma IP en 60 s"
    threshold: 4
    window_seconds: 60
    severity: "HIGH"
    action: "block_and_capture"
    cve_mitigated:
      - "CVE-2015-3306"    # Intento de evasión de cortafuegos y acceso a servicios no autorizados

  - id: RULE-004
    name: "Sondeo Anómalo de Servicios Web (Log4Shell / HTTP Probing)"
    source: "network_traffic"
    description: "≥4 solicitudes anómalas repetidas en 60 s hacia puertos de aplicación"
    threshold: 4
    window_seconds: 60
    severity: "MEDIUM"
    action: "alert_only"
    cve_mitigated:
      - "CVE-2021-44228"   # Log4Shell JNDI injection probing

whitelist:
  # Lista blanca anti-spoofing (ISO/IEC 27033-4 Cl. 9.2)
  # IPs críticas protegidas contra auto-bloqueo
  - "127.0.0.1"
  - "::1"
  - "192.168.1.1"
  - "8.8.8.8"
  - "8.8.4.4"
