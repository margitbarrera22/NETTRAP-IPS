<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetTrap-IPS · Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-top: 3px solid #10b981;
      border-radius: 12px;
      padding: 40px 48px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }

    .logo-icon {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #10b981, #059669);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .logo-text h1 {
      font-size: 1.3rem;
      font-weight: 700;
      color: #f1f5f9;
      letter-spacing: -0.5px;
    }

    .logo-text span {
      font-size: 0.75rem;
      color: #64748b;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #f1f5f9;
      font-size: 0.95rem;
      padding: 11px 14px;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 20px;
    }

    input:focus { border-color: #10b981; }

    .btn-login {
      width: 100%;
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      padding: 13px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      margin-top: 4px;
    }

    .btn-login:hover  { opacity: 0.9; }
    .btn-login:active { transform: scale(0.98); }

    .error-box {
      background: #450a0a;
      border: 1px solid #dc2626;
      border-radius: 8px;
      color: #fca5a5;
      font-size: 0.85rem;
      padding: 10px 14px;
      margin-bottom: 20px;
    }

    .security-note {
      margin-top: 24px;
      font-size: 0.72rem;
      color: #475569;
      text-align: center;
      line-height: 1.6;
    }

    .security-note code {
      background: #0f172a;
      padding: 1px 5px;
      border-radius: 4px;
      color: #10b981;
      font-size: 0.7rem;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo">
      <div class="logo-icon">🛡️</div>
      <div class="logo-text">
        <h1>NetTrap-IPS</h1>
        <span>CyberDefender · Acceso seguro</span>
      </div>
    </div>

    {% if error %}
    <div class="error-box">⚠️ {{ error }}</div>
    {% endif %}

    <!-- OWASP ASVS V2.1 — POST, no autocomplete de contraseña en campo protegido -->
    <form method="POST" action="/login" autocomplete="off">
      <label for="username">Usuario</label>
      <input type="text"     id="username" name="username"
             autocomplete="username" required spellcheck="false">

      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password"
             autocomplete="current-password" required>

      <button class="btn-login" type="submit">Iniciar sesión</button>
    </form>

    <p class="security-note">
      Sesión expira tras <code>30 min</code> de inactividad ·
      Bloqueo tras <code>5</code> intentos fallidos ·
      OWASP ASVS V3.2
    </p>
  </div>
</body>
</html>
